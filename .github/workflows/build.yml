name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Texturen und Daten erzeugen
        run: |
          pip install pillow
          cd tools
          python gen_textures.py
          python gen_data.py

      - name: Java 8 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Mod bauen
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Fertige .jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-overhaul-jar
          path: build/libs/*.jar
